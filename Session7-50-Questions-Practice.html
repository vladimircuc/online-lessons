<h1>50 Questions: Impact of Computing</h1>
<p class="sub">Scenario-based open questions first, then MCQ. All conceptual, no code tracing.</p>
<div id="content"></div>
<div class="score-bar"><span class="sc-c" id="sc-c">Correct: 0</span><span class="sc-w" id="sc-w">Wrong: 0</span><span class="sc-t" id="sc-t">Answered: 0 / 50</span></div>
<div style="height:60px"></div>
<script>
let correct=0,wrong=0,answered=0;
const DATA=[
{cluster:"Beneficial & Harmful Effects",desc:"Every innovation has both. Think in pairs."},
{type:"open",q:"A hospital implements an AI system that\nhelps doctors diagnose diseases from\nmedical images. Give 2 benefits and\n2 concerns.",a:"Benefits:\n1. Faster, more accurate diagnoses, catching\n   things human doctors might miss\n2. Can serve areas with doctor shortages,\n   improving access to specialist-level analysis\n\nConcerns:\n1. Algorithm trained on limited data may\n   misdiagnose conditions in underrepresented\n   populations (computing bias)\n2. Over-reliance on AI could reduce doctors'\n   diagnostic skills over time\n3. Privacy: sensitive medical images stored/processed\n4. Liability: who is responsible for a wrong diagnosis?"},
{type:"open",q:"Smart home devices (Alexa, Google Home)\nare always listening for a wake word.\nWhat are the privacy implications?",a:"Privacy concerns:\n- The device is constantly recording audio\n  to detect the wake word\n- Recordings may be stored on company servers\n- Employees may review recordings for \"quality\"\n- Could accidentally record private conversations\n- Data breaches could expose home audio\n- Could be subpoenaed as evidence in legal cases\n- Children's voices may be recorded without\n  meaningful consent\n\nBenefit trade-off:\n- Convenience of hands-free control\n- Accessibility for people with mobility issues"},
{type:"mcq",q:"Which is an unintended consequence\nof social media platforms?",o:["A. People can connect with distant friends","B. Businesses can advertise products","C. Echo chambers that reinforce existing beliefs","D. Users can share photos"],a:2,e:"A, B, D are intended features. C (echo chambers/filter bubbles) is an unintended consequence of recommendation algorithms showing users content they already agree with."},
{type:"mcq",q:"Self-driving cars could reduce accidents\ncaused by human error. A concern is:",o:["A. Cars will go faster","B. Ethical dilemmas about crash decisions and liability","C. People enjoy driving","D. Gas prices will increase"],a:1,e:"The trolley problem applied to driving: how should the car decide between two bad outcomes? And who is legally responsible when an autonomous car causes an accident? These are real, unsolved ethical issues."},
{type:"mcq",q:"Facial recognition in airports for\nsecurity. Which is a valid concern?",o:["A. It's too slow","B. Higher error rates for certain demographics constitute bias","C. Airports are too large","D. Facial recognition uses too much electricity"],a:1,e:"Facial recognition has documented higher error rates for women and people with darker skin. This means innocent people in those groups are more likely to be falsely flagged, constituting discriminatory bias."},
{type:"mcq",q:"A GPS navigation app benefits users by:",o:["A. Always finding the fastest route with no downsides","B. Providing efficient directions but potentially routing traffic through residential neighborhoods, harming those residents","C. Reducing all traffic everywhere","D. Eliminating the need for roads"],a:1,e:"B captures both the benefit (efficient routing) and an unintended harm (residential neighborhoods getting flooded with diverted traffic). A ignores downsides. C and D are unrealistic."},

{cluster:"Digital Divide",desc:"Access inequality and its consequences."},
{type:"open",q:"During COVID-19, many schools switched\nto remote learning. Explain how this\nrevealed the digital divide.",a:"The digital divide became starkly visible:\n\n- Students without home internet couldn't\n  attend virtual classes or submit work\n- Families with one shared device had multiple\n  children competing for screen time\n- Rural areas with no broadband were completely\n  cut off from online education\n- Low-income families couldn't afford devices\n  or data plans for streaming classes\n- Students without quiet study spaces struggled\n\nThe result: students who were already\ndisadvantaged fell further behind.\nThe technology that helped privileged students\ncontinue learning WIDENED the gap for others."},
{type:"mcq",q:"Which BEST describes the digital divide?",o:["A. The difference between Mac and Windows","B. Unequal access to technology and internet based on socioeconomic factors","C. The gap between old and new software versions","D. The difference between wired and wireless internet"],a:1,e:"The digital divide is about ACCESS inequality driven by income, geography, age, disability, and other socioeconomic factors."},
{type:"mcq",q:"A city provides free public Wi-Fi\nin all parks and libraries. This\naddresses the digital divide by:",o:["A. Making the internet faster for everyone","B. Providing access points for people who can't afford home internet","C. Replacing home internet entirely","D. Only helping people who live near parks"],a:1,e:"Free public Wi-Fi gives access to those who lack home internet. It doesn't solve everything (need a device, limited hours, etc.) but it directly addresses the access gap."},
{type:"mcq",q:"An online-only job application system\ncould worsen the digital divide because:",o:["A. It makes applying too easy","B. People without internet access cannot apply, excluding them from employment opportunities","C. It costs the company too much money","D. Only young people use the internet"],a:1,e:"If applying requires internet access, those without it are excluded from the opportunity entirely. This disproportionately affects low-income, rural, and elderly populations."},
{type:"mcq",q:"Which population is LEAST likely to\nbe affected by the digital divide?",o:["A. Rural elderly residents","B. Low-income urban families","C. Middle-class suburban professionals with broadband","D. Residents of developing nations"],a:2,e:"Middle-class suburban professionals typically have reliable broadband, personal devices, and digital literacy. The other groups face access barriers related to geography, income, or infrastructure."},

{cluster:"Computing Bias",desc:"Where it comes from and who it affects."},
{type:"open",q:"A bank uses an algorithm to approve or\ndeny mortgage applications. The algorithm\nwas trained on 20 years of past decisions.\n\nExplain why this could be problematic\nfor certain groups.",a:"Historical mortgage lending was deeply biased:\n- Redlining (denying loans based on neighborhood\n  racial composition) was legal for decades\n- Minority applicants were denied at higher rates\n  even with similar financial profiles\n\nTraining on this data means the algorithm\nlearns these discriminatory patterns and\nreplicates them:\n- Applicants from historically redlined zip codes\n  get denied at higher rates\n- The algorithm may use proxies for race (zip code,\n  school district, name patterns)\n- Past bias becomes automated and scaled\n\nThis is particularly dangerous because:\n- The algorithm appears \"objective\" and \"data-driven\"\n- But it's encoding human prejudice in code\n- Affected applicants may not know why they were denied\n- It perpetuates wealth gaps across generations"},
{type:"open",q:"A search engine's image results for\n\"CEO\" show mostly white men.\nIs the algorithm biased? Explain.",a:"Yes, this reflects bias, but the source is complex:\n\n1. The training data (web images) reflects\n   real-world inequality: most current CEOs\n   ARE white men due to historical barriers\n2. The algorithm accurately reflects the data\n   but reinforces the stereotype\n3. By showing mostly white male CEOs, it\n   normalizes the idea that CEOs \"should\" look\n   like that, discouraging others\n4. The algorithm isn't intentionally biased,\n   but the IMPACT is biased\n\nThe key insight: an algorithm can be technically\naccurate about current data while still\nperpetuating harmful stereotypes.\nAccuracy ≠ fairness."},
{type:"mcq",q:"A predictive policing algorithm recommends\nmore patrols in neighborhoods with\nhistorically high arrest rates. The risk is:",o:["A. Police will have nothing to do","B. More patrols lead to more arrests in those areas, creating a feedback loop that reinforces the original bias","C. Crime will completely disappear","D. The algorithm is too expensive"],a:1,e:"This is a feedback loop: more patrols → more arrests → data shows more crime → even more patrols. The areas were over-policed historically, and the algorithm automates that pattern. Meanwhile, crimes in under-policed areas go undetected."},
{type:"mcq",q:"The BEST way to address bias in an\nalgorithm is to:",o:["A. Remove all data and start over","B. Use only data from one demographic","C. Audit the algorithm for disparate impact, diversify training data, and include human oversight","D. Make the algorithm more complex"],a:2,e:"C addresses bias at multiple levels: test if outcomes differ by group (audit), ensure training data represents all groups (diversify), and keep humans in the loop for high-stakes decisions (oversight)."},
{type:"mcq",q:"A voice recognition system works well\nfor American English but poorly for\naccented English. This is because:",o:["A. Accented English is incorrect","B. The training data likely overrepresented American English speakers","C. The algorithm is too simple","D. Voice recognition can only handle one language"],a:1,e:"If the training data was mostly American English speakers, the system learned those speech patterns best. Underrepresented accents get higher error rates. This is a data representation bias."},
{type:"mcq",q:"An algorithm that determines insurance\nrates uses zip code as a factor.\nThis could be considered biased because:",o:["A. Zip codes are too long to process","B. Zip code often correlates with race and income, acting as a proxy for protected characteristics","C. Insurance should be free","D. Algorithms can't process location data"],a:1,e:"Zip codes correlate strongly with race and socioeconomic status. Using zip code as a factor can effectively discriminate by race/income even without explicitly using those variables. This is proxy discrimination."},

{cluster:"Crowdsourcing",desc:"Collective contributions, benefits and limits."},
{type:"open",q:"Waze uses data from millions of drivers\nto report traffic, accidents, and road\nconditions in real-time.\n\nHow is this crowdsourcing? What are\nthe benefits and limitations?",a:"How it's crowdsourcing:\nMillions of individual drivers contribute\ndata (speed, location, manual reports)\nthat collectively creates a real-time\ntraffic map no single entity could build.\n\nBenefits:\n- Real-time data more current than any\n  official traffic monitoring system\n- Covers roads that official sensors don't\n- Accident/hazard reports save lives\n- Scales automatically as more users join\n\nLimitations:\n- Accuracy depends on user density (sparse\n  in rural areas = less useful)\n- False reports possible (intentional or accidental)\n- Users must have smartphones with data plans\n  (digital divide, again)\n- Relies on users' willingness to contribute"},
{type:"mcq",q:"Which is a limitation of crowdsourcing\nfor scientific research?",o:["A. Too many people participate","B. Contributions may vary in quality and accuracy, requiring verification","C. Scientists don't use computers","D. Crowdsourcing is too expensive"],a:1,e:"Crowdsourced data quality varies. Some contributors are careful, others make mistakes. Verification and quality control are major challenges."},
{type:"mcq",q:"reCAPTCHA asks users to identify\nobjects in images. This benefits:",o:["A. Only the user","B. AI training datasets, as users unknowingly label images that train machine learning models","C. Only the website","D. Nobody, it's just annoying"],a:1,e:"reCAPTCHA serves dual purpose: verifying humans AND collecting labeled training data for Google's AI. Users contribute to AI development while proving they're not bots."},
{type:"mcq",q:"Open-source software like Linux is\ndeveloped through crowdsourcing.\nA benefit is:",o:["A. No one is responsible for bugs","B. Thousands of developers can review, improve, and fix the code collaboratively","C. It's always easier to use than commercial software","D. It never has security vulnerabilities"],a:1,e:"Open source benefits from collective review: many eyes catch bugs that a small team might miss. A is wrong (maintainers are responsible). C is subjective. D is false (OSS can have vulnerabilities too, but they're often found faster)."},

{cluster:"Legal & Ethical",desc:"Copyright, CC, open source. Know the distinctions."},
{type:"open",q:"A student downloads a song from YouTube\nand uses it as background music in a\nclass presentation video that gets\nuploaded to the school's public website.\n\nIs this a copyright violation? Explain.",a:"Yes, this is likely a copyright violation.\n\nThe song is copyrighted by the artist/label.\nUsing it without permission in a video\nthat's publicly accessible online goes\nbeyond personal/educational fair use.\n\nWhat the student should do:\n- Use royalty-free music\n- Use music with a Creative Commons license\n  that allows reuse\n- Get explicit permission from the copyright\n  holder\n- Use music from a free music library\n  designed for this purpose\n\nNote: Fair use is complex and debatable,\nbut uploading to a public website makes\nthe fair use argument much weaker than\njust showing it in class."},
{type:"mcq",q:"A photographer licenses their images\nunder CC BY-NC. A company uses one\nin a paid advertisement. This is:",o:["A. Allowed because CC means free to use","B. A violation because NC means non-commercial use only","C. Allowed if they credit the photographer","D. Allowed because advertisements are educational"],a:1,e:"NC = non-commercial. A paid advertisement is commercial use. Even with credit (BY), the NC restriction prohibits this use. The company would need separate permission or a different license."},
{type:"mcq",q:"Public domain means:",o:["A. Posted on a public website","B. The work has no copyright protection and can be freely used by anyone","C. The work is open source","D. The work is owned by the government"],a:1,e:"Public domain = no copyright restrictions. Anyone can use, modify, or distribute the work freely. This happens when copyright expires, or the creator explicitly dedicates it to the public domain."},
{type:"mcq",q:"Software licensed under GPL (a copyleft\nopen source license) requires that:",o:["A. You must pay to use it","B. Derivative works must also be open source under the same license","C. You can never modify the code","D. Only the original author can distribute it"],a:1,e:"GPL's copyleft provision means if you modify and distribute the code, your version must also be GPL-licensed and open source. This ensures derivatives remain free and open."},
{type:"mcq",q:"Which is TRUE about copyright?",o:["A. You must register to get copyright protection","B. Copyright applies automatically when you create an original work","C. Copyright only protects published works","D. Copyright lasts only 10 years"],a:1,e:"Copyright is automatic upon creation. No registration required (though it helps in legal disputes). It protects both published and unpublished works and lasts the creator's lifetime + 70 years in the US."},

{cluster:"PII & Data Privacy",desc:"What counts as PII and how it's at risk."},
{type:"open",q:"A free mobile game asks for access to:\n- Camera\n- Microphone\n- Contacts\n- Location\n- Photo gallery\n\nThe game is a simple puzzle game.\nWhat privacy concerns exist?",a:"Massive red flag. A puzzle game should NOT\nneed any of these permissions.\n\nConcerns:\n- Camera/Mic: could record without knowledge\n- Contacts: could harvest phone numbers for\n  spam, sold to data brokers\n- Location: tracks where you are 24/7,\n  builds a movement profile\n- Photos: could access private images\n\nAll of this is PII being collected far\nbeyond what the game needs to function.\n\nThe game is likely:\n- Selling user data to advertisers\n- Building detailed user profiles\n- The \"free\" price is actually paid with data\n\nAlways check: does this app NEED these\npermissions to function?"},
{type:"open",q:"A company suffers a data breach.\n10 million users' names, emails, and\nhashed passwords are stolen.\n\nWhat are the potential consequences\nfor users?",a:"Immediate risks:\n- Email addresses used for phishing attacks\n- Hashed passwords could be cracked (especially\n  weak passwords) revealing the actual password\n- Users who reuse passwords on other sites\n  are now vulnerable everywhere\n\nLonger-term risks:\n- Identity theft using name + email\n- Targeted scam campaigns\n- Data sold on dark web\n- Combined with other breached data for\n  more complete identity profiles\n\nWhat users should do:\n- Change passwords immediately\n- Enable MFA on important accounts\n- Use unique passwords per site\n- Monitor for suspicious account activity"},
{type:"mcq",q:"Which is NOT PII?",o:["A. A user's browsing history","B. A phone's IMEI (unique device ID)","C. The current weather in Dallas","D. An IP address"],a:2,e:"Weather in Dallas is general public information, not tied to any individual. Browsing history, device IDs, and IP addresses can all be linked to specific people."},
{type:"mcq",q:"Even after \"anonymizing\" a dataset,\nre-identification is possible because:",o:["A. Anonymous data doesn't exist","B. Unique combinations of remaining fields (age, zip, gender) can identify individuals","C. All data is always public","D. Anonymization is illegal"],a:1,e:"A combination of quasi-identifiers (zip code + age + gender) can narrow down to a single person, especially in small populations. Research has shown 87% of Americans can be uniquely identified by just zip code, gender, and date of birth."},
{type:"mcq",q:"GDPR and similar privacy laws require\ncompanies to:",o:["A. Never collect any data","B. Get consent before collecting personal data and allow users to request deletion","C. Store all data forever","D. Share data freely with other companies"],a:1,e:"Privacy regulations require informed consent, data minimization (collect only what's needed), and the right to be forgotten (users can request deletion of their data)."},
{type:"mcq",q:"A fitness tracker collects heart rate\ndata. This is sensitive because:",o:["A. Heart rate is always private","B. Health data combined with identity could affect insurance rates, employment, or be used discriminatorily","C. Fitness trackers are expensive","D. Heart rate data is too large to store"],a:1,e:"Health data is among the most sensitive PII. If linked to identity, it could be used by insurers to deny coverage, employers to screen candidates, or anyone seeking to exploit health vulnerabilities."},

{cluster:"Cybersecurity",desc:"Encryption, phishing, malware, and defenses."},
{type:"open",q:"Explain how public key encryption solves\nthe key-sharing problem of symmetric\nencryption. Use an analogy if helpful.",a:"Symmetric problem:\nIf I want to send you an encrypted message,\nwe need the SAME key. But how do I get you\nthe key securely? If I send it unencrypted,\nan attacker could intercept it.\n\nPublic key solution:\nThink of it like a MAILBOX:\n- You give everyone a copy of your mailbox key\n  (public key, anyone can PUT mail in)\n- Only YOU have the key to OPEN the mailbox\n  (private key, only you can read it)\n\nAnyone can encrypt a message with your public\nkey (drop it in the mailbox). Only your private\nkey can decrypt it (open the mailbox).\n\nThe private key NEVER needs to be shared.\nThat's what solves the key-sharing problem."},
{type:"mcq",q:"A CEO receives an email that appears\nto be from the company's bank, asking\nthem to verify account details urgently.\nThis is most likely:",o:["A. A legitimate request","B. A phishing attack using social engineering","C. A software virus","D. A DDoS attack"],a:1,e:"Classic phishing: impersonates a trusted entity (bank), creates urgency, and asks for sensitive information. Social engineering targets human behavior, not technology."},
{type:"mcq",q:"Ransomware differs from other malware\nbecause it:",o:["A. Steals passwords","B. Encrypts your files and demands payment for the decryption key","C. Slows down your computer","D. Sends spam from your email"],a:1,e:"Ransomware's defining characteristic is encrypting victim files and demanding payment. Other malware may steal data or cause damage, but the ransom demand is unique to ransomware."},
{type:"mcq",q:"HTTPS is more secure than HTTP because:",o:["A. It loads pages faster","B. It encrypts data in transit between your browser and the server","C. It blocks all viruses","D. It doesn't use cookies"],a:1,e:"HTTPS = HTTP + TLS/SSL encryption. Data sent between your browser and the server is encrypted, preventing eavesdropping. HTTP sends data in plaintext, visible to anyone monitoring the network."},
{type:"mcq",q:"The weakest link in most security\nsystems is:",o:["A. The encryption algorithm","B. The firewall hardware","C. Human behavior (clicking phishing links, weak passwords, sharing credentials)","D. The operating system"],a:2,e:"Social engineering exploits human error. The strongest encryption is useless if someone reveals their password to a phishing email. Security training for people is as important as technical defenses."},
{type:"mcq",q:"A keylogger is dangerous because:",o:["A. It deletes your files","B. It records every keystroke, capturing passwords, messages, and credit card numbers as you type them","C. It changes your desktop background","D. It blocks websites"],a:1,e:"Keyloggers silently record everything typed, including passwords and financial information, then send it to the attacker. Particularly dangerous because the user has no visible indication it's running."},

{cluster:"Authentication & Digital Footprint",desc:"MFA, cookies, and the permanence of online activity."},
{type:"open",q:"A 16-year-old posts controversial opinions\non social media using their real name.\nTen years later, they apply for a job.\n\nWhat digital footprint issue exists?",a:"The posts are part of their permanent\ndigital footprint:\n\n- Even if deleted, posts may have been:\n  - Screenshotted by others\n  - Cached by search engines\n  - Archived by web crawlers (Wayback Machine)\n  - Shared/reposted by other users\n\n- Employers commonly search candidates online\n- The controversial opinions, posted as a teenager,\n  could cost them the job opportunity\n- Context is lost: a 16-year-old's views may not\n  represent the 26-year-old they became\n\nLesson: your digital footprint is essentially\npermanent. What you post at 16 follows you\nto 26 and beyond."},
{type:"mcq",q:"Which combination is TRUE multifactor\nauthentication (MFA)?",o:["A. Password + security question","B. PIN + a second different PIN","C. Fingerprint scan + a code texted to your phone","D. Email address + password"],a:2,e:"Fingerprint (something you ARE) + SMS code (something you HAVE) = two different categories = true MFA. A: both \"know.\" B: both \"know.\" D: both \"know.\""},
{type:"mcq",q:"Third-party cookies are used to:",o:["A. Store your password securely","B. Track your browsing across multiple websites to build an advertising profile","C. Make websites load faster","D. Protect against malware"],a:1,e:"Third-party cookies are placed by advertisers, not the site you're visiting. They track your activity across many sites to build a profile for targeted advertising."},
{type:"mcq",q:"Which is a passive digital footprint?",o:["A. Posting a YouTube comment","B. Sending a tweet","C. A website logging your IP address and visit time without your direct action","D. Writing a blog post"],a:2,e:"Passive footprint = data collected without your deliberate creation. A website logging your visit happens automatically. A, B, D are all active (you intentionally created content)."},
{type:"mcq",q:"Two-factor authentication protects\nagainst stolen passwords because:",o:["A. It makes passwords longer","B. Even with the password, an attacker needs the second factor (phone, fingerprint) which they likely don't have","C. It encrypts the password","D. It changes the password automatically"],a:1,e:"If someone steals your password (something you know), they still can't access your account without the second factor (your phone or fingerprint). This is the whole point of MFA."},
{type:"mcq",q:"A company's privacy policy says it\n\"may share anonymized data with third\nparties.\" A concern is:",o:["A. Anonymized data is always perfectly safe","B. Anonymization can sometimes be reversed through re-identification, especially when combined with other datasets","C. Third parties are always trustworthy","D. Privacy policies are legally binding so there's no risk"],a:1,e:"\"Anonymized\" data can sometimes be de-anonymized through combination with other data sources. The word \"may\" also gives the company broad discretion in how they share data."},

{cluster:"Mixed Challenges",desc:"Everything combined."},
{type:"mcq",q:"A city uses AI to allocate public\nresources (police, social services,\ninfrastructure funding). The BIGGEST\nethical concern is:",o:["A. AI is too slow for this task","B. The algorithm could perpetuate or amplify existing inequities in resource distribution","C. Cities shouldn't use computers","D. AI always makes optimal decisions"],a:1,e:"If historical data reflects unequal resource distribution, the AI will learn and perpetuate those patterns. Communities that were historically underserved may continue to be underserved by the algorithm."},
{type:"mcq",q:"Which pair of concepts are CORRECTLY\nmatched?",o:["A. Phishing = encrypting files for ransom","B. Crowdsourcing = one expert solving a problem","C. Digital divide = gap between those with and without tech access","D. Copyright = anyone can use the work freely"],a:2,e:"C is correct. A describes ransomware. B is the opposite of crowdsourcing. D describes public domain, not copyright."},
{type:"mcq",q:"A school uses proctoring software that\nmonitors students through their webcams\nduring online exams. A concern is:",o:["A. The software makes exams too easy","B. It invades student privacy by recording them in their homes and may flag innocent behavior as cheating","C. It costs too much to grade exams","D. Students prefer paper exams"],a:1,e:"Proctoring software raises serious privacy concerns: recording students in their personal spaces, potential for false flags (looking away = suspicious?), and data storage of minors' images. It disproportionately affects students with shared living spaces or nonstandard testing environments."},
{type:"mcq",q:"The EU's \"right to be forgotten\" allows\npeople to request that search engines\nremove certain results about them.\nAn argument AGAINST this right is:",o:["A. People should never be forgotten","B. It could be used to suppress legitimate public interest information, conflicting with freedom of expression","C. Search engines can't remove results","D. The EU doesn't have internet"],a:1,e:"There's a tension between privacy rights and public interest/free expression. A politician wanting to remove articles about past corruption raises different concerns than a private citizen wanting to remove outdated personal information."},
{type:"mcq",q:"Computing innovations can create\neconomic disruption by:",o:["A. Making all products free","B. Automating jobs previously done by humans, causing displacement in certain industries","C. Preventing all economic growth","D. Only affecting the tech industry"],a:1,e:"Automation and AI can displace workers in manufacturing, transportation, retail, and other industries. While new jobs are created, the transition can be painful for affected workers who need retraining."},
{type:"mcq",q:"Which is the BEST example of using\ncomputing for social good?",o:["A. A company maximizing ad revenue","B. A nonprofit using data analytics to optimize food distribution to underserved communities","C. A social media platform increasing engagement","D. A gaming company releasing a new title"],a:1,e:"B uses computing to directly address a social problem (food insecurity) for underserved populations. A and C are commercial goals. D is entertainment, not social good specifically."}
];

function build(){
    const el=document.getElementById('content');let qNum=0,html='';
    DATA.forEach(item=>{
        if(item.cluster){html+=`<div class="cluster"><div class="cluster-title">${item.cluster}</div><div class="cluster-desc">${item.desc}</div></div>`;return;}
        qNum++;const qid='q'+qNum;
        if(item.type==='open'){
            html+=`<div class="qcard"><div class="qhead"><span class="qnum">${qNum}</span><span class="qtype">OPEN</span></div><div class="qtext">${esc(item.q)}</div><textarea class="open-input mono" placeholder="Her answer..."></textarea><button class="reveal-btn" onclick="rv(this)">Show Answer</button><div class="ans-box"><div class="ans-text">${esc(item.a)}</div></div></div>`;
        } else {
            html+=`<div class="qcard" id="${qid}" data-rev="0" data-sel=""><div class="qhead"><span class="qnum">${qNum}</span><span class="qtype">MCQ</span></div><div class="qtext">${esc(item.q)}</div><div class="opts">`;
            item.o.forEach((opt,oi)=>{html+=`<button class="opt" data-i="${oi}" onclick="so(this,'${qid}')">${esc(opt)}</button>`;});
            html+=`</div><button class="chk" onclick="ck(this,'${qid}',${item.a})">Check Answer</button><div class="expl">${esc(item.e)}</div></div>`;
        }
    });el.innerHTML=html;
}
function rv(btn){const a=btn.nextElementSibling;const s=a.classList.contains('show');a.classList.toggle('show');btn.textContent=s?'Show Answer':'Hide';btn.classList.toggle('on',!s);}
function so(btn,qid){const c=document.getElementById(qid);if(c.dataset.rev==='1')return;c.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));btn.classList.add('sel');c.dataset.sel=btn.dataset.i;c.querySelector('.chk').classList.add('rdy');}
function ck(btn,qid,ans){const c=document.getElementById(qid);if(!c.dataset.sel||c.dataset.sel==='')return;if(c.dataset.rev==='1')return;c.dataset.rev='1';const s=parseInt(c.dataset.sel);c.querySelectorAll('.opt').forEach((o,i)=>{o.classList.add('locked');o.classList.remove('sel');if(i===ans)o.classList.add('right');else if(i===s&&i!==ans)o.classList.add('wrong');});c.querySelector('.expl').classList.add('show');if(s===ans)correct++;else wrong++;answered++;upd();btn.style.display='none';}
function upd(){document.getElementById('sc-c').textContent='Correct: '+correct;document.getElementById('sc-w').textContent='Wrong: '+wrong;document.getElementById('sc-t').textContent='Answered: '+answered+' / 50';}
window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-window.innerHeight;document.getElementById('prog').style.width=(window.scrollY/h*100)+'%';});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
build();
</script>
