<h1>50 Questions: Networks & Creative Development</h1>

<div id="content"></div>
<div class="score-bar"><span class="sc-c" id="sc-c">Correct: 0</span><span class="sc-w" id="sc-w">Wrong: 0</span><span class="sc-t" id="sc-t">Answered: 0 / 50</span></div>

<script>
let correct=0,wrong=0,answered=0;
const DATA=[
{cluster:"Internet Basics & Protocols",desc:"How the internet works, what each protocol does."},
{type:"open",q:"Explain the difference between\nthe internet and the World Wide Web.\nGive an example of something that\nuses the internet but is NOT the WWW.",a:"Internet: the global network infrastructure\n(physical cables, routers, protocols) that\nconnects billions of devices.\n\nWWW: a system of linked web pages accessed\nvia browsers using HTTP/HTTPS. It runs ON\nthe internet but is not the internet.\n\nExamples that use internet but NOT WWW:\n- Email (SMTP/IMAP protocols)\n- Online gaming\n- Video streaming apps\n- File transfer (FTP)\n- Voice over IP (phone calls)\n- IoT device communication"},
{type:"open",q:"You type \"amazon.com\" in your browser.\nDescribe what happens step by step\nusing DNS, TCP, IP, and HTTP.",a:"1. DNS: Your browser asks a DNS server\n   to translate \"amazon.com\" into an IP\n   address (e.g., 52.94.236.248)\n\n2. TCP: Your browser creates a connection\n   to Amazon's server. Your request is\n   broken into numbered packets.\n\n3. IP: Each packet is given source and\n   destination IP addresses. Routers forward\n   packets toward Amazon's IP. Different\n   packets may take different routes.\n\n4. HTTP/HTTPS: Your browser sends an HTTP\n   GET request for the homepage. HTTPS\n   encrypts the communication.\n\n5. Amazon's server sends back the webpage\n   data as packets. TCP reassembles them\n   in order. Your browser renders the page."},
{type:"open",q:"Why does the internet use OPEN\n(non-proprietary) protocols?\nWhat would happen if protocols\nwere proprietary?",a:"Open protocols mean ANY device from ANY\nmanufacturer can connect to the internet\nas long as it follows the standards.\n\nIf protocols were proprietary:\n- Only certain brands could connect\n- Different networks couldn't communicate\n- Innovation would be stifled (permission needed)\n- One company could control the entire internet\n- Cost would increase (licensing fees)\n\nOpen standards are WHY the internet grew:\nanyone can build devices and services that\nwork with the existing infrastructure."},
{type:"mcq",q:"DNS is often called the \"phone book\"\nof the internet because it:",o:["A. Stores phone numbers","B. Translates human-readable domain names into numeric IP addresses","C. Connects phone calls","D. Lists all websites alphabetically"],a:1,e:"Just like a phone book converts names to phone numbers, DNS converts domain names (google.com) to IP addresses (142.250.80.46)."},
{type:"mcq",q:"TCP's main job is to:",o:["A. Assign IP addresses to devices","B. Encrypt web traffic","C. Ensure reliable, ordered delivery of data by managing packets","D. Translate domain names"],a:2,e:"TCP handles: breaking data into packets, numbering them, verifying delivery, resending lost packets, and reassembling in order. IP handles addressing/routing. DNS handles name translation. HTTPS handles encryption."},
{type:"mcq",q:"IPv6 was developed because:",o:["A. IPv4 was too secure","B. IPv4's 32-bit addresses were running out (~4.3 billion max)","C. IPv6 is slower but more reliable","D. IPv4 didn't support email"],a:1,e:"With billions of devices needing addresses, 4.3 billion IPv4 addresses aren't enough. IPv6 uses 128 bits, providing a virtually unlimited number of addresses."},
{type:"mcq",q:"Which protocol adds encryption to\nweb browsing?",o:["A. HTTP","B. DNS","C. HTTPS","D. TCP"],a:2,e:"HTTPS = HTTP + TLS/SSL encryption. Data between your browser and the server is encrypted, preventing eavesdropping. Regular HTTP sends everything in plaintext."},
{type:"mcq",q:"Which layer handles the ADDRESSING\nof packets (where they go)?",o:["A. TCP","B. IP","C. HTTP","D. DNS"],a:1,e:"IP (Internet Protocol) handles addressing. Each packet gets source and destination IP addresses. Routers use these to forward packets toward the destination."},

{cluster:"Packets & Routing",desc:"How data travels across the internet."},
{type:"open",q:"A large file is sent from New York to\nLos Angeles. Explain why different packets\nfrom this file might take different routes\nand arrive in different orders.",a:"Packet switching means each packet is routed\nindependently based on current conditions:\n\n- Router 1 might send Packet A through Chicago\n  because that route is less congested\n- Router 1 might send Packet B through Dallas\n  because Chicago got busy after Packet A\n\nReasons for different routes:\n- Network congestion changes moment to moment\n- A link might go down after some packets passed\n- Routers make real-time decisions per packet\n\nReasons for out-of-order arrival:\n- The Dallas route might be physically shorter\n  so Packet B (sent second) arrives first\n- Different routes have different speeds/delays\n\nTCP handles this by using sequence numbers\nto reassemble everything correctly."},
{type:"mcq",q:"Packets contain which information?",o:["A. Only the data being sent","B. Data plus source IP, destination IP, and sequence number","C. Only IP addresses","D. Only the sequence number"],a:1,e:"Each packet carries: a chunk of the actual data, the source IP (who sent it), destination IP (where it's going), and a sequence number (for reassembly). All are necessary for delivery."},
{type:"mcq",q:"Packet switching is more efficient than\nsending data as one continuous stream\nbecause:",o:["A. It uses less electricity","B. Multiple users can share network capacity, and if part is lost only that packet needs resending","C. It requires fewer cables","D. Packets are always delivered in order"],a:1,e:"Packet switching allows network sharing (packets from different users interleave on the same wires) and efficient error recovery (resend one lost packet, not the entire file). Packets may arrive out of order, which TCP handles."},
{type:"mcq",q:"If a router along a packet's path\nfails, the packet:",o:["A. Is permanently lost","B. Can be rerouted through a different path by other routers","C. Returns to the sender automatically","D. Waits until the router is repaired"],a:1,e:"The internet's redundant structure means alternate paths usually exist. Other routers detect the failure and forward packets along working routes. If no alternate exists, TCP detects the loss and requests retransmission."},
{type:"mcq",q:"A video call sends data continuously.\nWhy might the video occasionally freeze\nor pixelate?",o:["A. The camera is broken","B. Network congestion causes packet loss or delay, and real-time video can't wait for retransmission","C. The internet doesn't support video","D. DNS fails during the call"],a:1,e:"Video calls are time-sensitive. If packets are delayed or lost due to congestion, there's no time to wait for retransmission. Missing packets cause visual glitches. This is why video quality drops on slow connections."},

{cluster:"Fault Tolerance",desc:"Redundancy, single points of failure, network diagrams."},
{type:"open",q:"Draw (describe) a network of 4 devices\n(A, B, C, D) that IS fault-tolerant.\nThen describe one that is NOT.",a:"FAULT-TOLERANT:\nA --- B\n|  X  |\nC --- D\n(A connects to B, C, D)\n(B connects to A, C, D)\n(C connects to A, B, D)\n(D connects to A, B, C)\nFully connected. Remove any single connection\nand every device can still reach every other.\n\nNOT FAULT-TOLERANT:\nA --- B --- C --- D\nLinear chain. Remove B-C and A/B can't reach\nC/D. Every link is a single point of failure."},
{type:"open",q:"Network:\n  A --- B\n  |     |\n  C --- D --- E\n\nIf connection B-D fails, can A reach E?\nIf connection C-D fails, can A reach E?",a:"If B-D fails:\nA→B: B can't reach D directly.\nA→C→D→E: YES! Alternate path exists.\nSo A CAN reach E. Network is fault-tolerant\nfor this failure.\n\nIf C-D fails:\nA→B→D→E: YES! Through B-D path.\nA→C: C is now a dead end for reaching E.\nBut A→B→D→E works.\nSo A CAN still reach E.\n\nWhat if BOTH B-D AND C-D fail?\nThen D and E are completely disconnected.\nA cannot reach E. The network is NOT\nfault-tolerant for two simultaneous failures\non both paths to D."},
{type:"mcq",q:"A network where every device connects\nto every other device is called:",o:["A. A linear network","B. A fully connected (mesh) network","C. A star network","D. A ring network"],a:1,e:"A fully connected or mesh network has direct connections between all pairs. Maximum redundancy, maximum fault tolerance, but also the most expensive to build."},
{type:"mcq",q:"A star network has all devices\nconnected to one central hub.\nThe hub is a:",o:["A. Redundant backup","B. Single point of failure","C. Fault-tolerant design","D. DNS server"],a:1,e:"If the central hub fails, ALL communication stops. No device can reach any other. The hub is a classic single point of failure."},
{type:"mcq",q:"Adding a redundant connection between\ntwo devices that are already connected\nthrough other paths:",o:["A. Wastes resources with no benefit","B. Increases fault tolerance by providing an additional alternate path","C. Slows down the network","D. Violates internet protocols"],a:1,e:"Redundancy = more alternate paths = better fault tolerance. Even if a path already exists, an additional one means more options if something fails. This is how the internet backbone is designed."},
{type:"mcq",q:"Which network is MOST fault-tolerant?\n\nA: Each device connects to exactly 1 other\nB: Each device connects to exactly 2 others\nC: Each device connects to ALL others\nD: Only 1 device connects to all others",o:["A. Network A","B. Network B","C. Network C","D. Network D"],a:2,e:"C (fully connected mesh) has maximum redundancy. Every pair has a direct connection plus paths through other devices. A is the least tolerant. D is a star with a single point of failure."},

{cluster:"Parallel & Distributed Computing",desc:"Speedup, sequential bottlenecks, distributed systems."},
{type:"open",q:"A task has 3 parts:\nPart A: 10 sec (must be first)\nPart B: 6 independent sub-tasks, 5 sec each\nPart C: 5 sec (must be last)\n\nCalculate sequential time and parallel\ntime with 3 processors for Part B.",a:"Sequential time:\n10 + (6 * 5) + 5 = 10 + 30 + 5 = 45 seconds\n\nParallel time (3 processors for Part B):\nPart A: 10 sec (sequential, can't parallelize)\nPart B: 6 sub-tasks / 3 processors = 2 rounds\n  Round 1: 3 sub-tasks run simultaneously (5 sec)\n  Round 2: 3 more sub-tasks simultaneously (5 sec)\n  Part B total: 10 sec\nPart C: 5 sec (sequential)\n\nTotal: 10 + 10 + 5 = 25 seconds\nSpeedup = 45/25 = 1.8x"},
{type:"mcq",q:"Doubling the number of processors\nwill NOT halve the total time if:",o:["A. The processors are fast enough","B. A significant portion of the task must run sequentially","C. The task is parallelizable","D. The network is fast"],a:1,e:"Sequential portions can't benefit from more processors. If 50% of the task is sequential, even infinite processors can only speed up the other 50%. This is Amdahl's Law."},
{type:"mcq",q:"Distributed computing differs from\nparallel computing because:",o:["A. It only uses one computer","B. Multiple separate computers connected by a network collaborate on a task","C. It's always slower","D. It doesn't use the internet"],a:1,e:"Parallel = multiple processors in one machine. Distributed = multiple separate machines connected by a network. Distributed adds network communication overhead but can harness far more total computing power."},
{type:"mcq",q:"A web search engine processes millions\nof queries per second by distributing\nthem across thousands of servers.\nThis is an example of:",o:["A. Sequential computing","B. Distributed computing","C. A single powerful computer","D. Analog computing"],a:1,e:"The workload is spread across thousands of machines in data centers worldwide. No single machine could handle the traffic. This is distributed computing at scale."},
{type:"mcq",q:"A program takes 200 seconds.\n150 seconds is parallelizable.\n50 seconds is sequential.\nWith 10 processors, the parallel\nportion takes 150/10 = 15 seconds.\nTotal parallel time is:",o:["A. 20 seconds","B. 50 seconds","C. 65 seconds","D. 200 seconds"],a:2,e:"Sequential: 50 sec (unchanged). Parallel: 150/10 = 15 sec. Total: 50 + 15 = 65 seconds. Speedup = 200/65 ≈ 3.1x. The sequential portion limits the speedup."},
{type:"mcq",q:"Which task benefits MOST from\nparallel computing?",o:["A. Reading a book page by page","B. Processing 1 million independent images (each can be processed separately)","C. Following a recipe step by step","D. Counting from 1 to 100"],a:1,e:"1 million independent images can be split across processors (each handles some images). A and C have sequential dependencies. D is trivially fast and wouldn't benefit significantly."},

{cluster:"Error Types (BI1)",desc:"Syntax, logic, runtime. Which is which?"},
{type:"open",q:"For each scenario, identify the error type:\n\n1. Missing closing parenthesis: print(\"hi\"\n2. Loop runs one too many times\n3. Program divides by a variable that is 0\n4. Using = instead of == in a condition\n5. Accessing index 10 of a 5-element list",a:"1. SYNTAX error: grammar violation, won't run\n2. LOGIC error: off-by-one, runs but wrong output\n3. RUNTIME error: crashes during execution\n4. Depends on context:\n   In Python: SYNTAX error in IF (assignment\n   in condition isn't valid Python syntax)\n   In AP pseudocode: using = IS the comparison\n   operator, so it might be correct\n5. RUNTIME error: index out of bounds, crashes"},
{type:"mcq",q:"A program calculates a student's grade\nas 'A' for 90-100, 'B' for 80-89, etc.\nIt gives everyone an 'A' regardless of\ntheir score. This is a:",o:["A. Syntax error","B. Logic error","C. Runtime error","D. Hardware error"],a:1,e:"The program runs without crashing but gives wrong results. The conditions are likely structured incorrectly (maybe checking >= 90 first and all scores pass that check due to a logic mistake). Classic logic error."},
{type:"mcq",q:"A program works perfectly with 100\ndata points but crashes with 1 million\ndata points due to memory exhaustion.\nThis is a:",o:["A. Syntax error","B. Logic error","C. Runtime error","D. Not an error"],a:2,e:"The program starts running fine but crashes when it runs out of memory. This happens during execution, not before. It's a runtime error."},
{type:"mcq",q:"Which error type is hardest to detect\nand why?",o:["A. Syntax, because compilers can't find them","B. Runtime, because they never produce messages","C. Logic, because the program runs normally but produces incorrect results with no error message","D. All errors are equally hard to find"],a:2,e:"Logic errors don't crash the program or produce error messages. The output just looks wrong. You only catch them by carefully testing and comparing actual vs expected output. Syntax errors are caught by the compiler. Runtime errors produce crash messages."},
{type:"mcq",q:"A programmer writes:\nIF score > 100\n    DISPLAY(\"Perfect!\")\nThe code runs. No student has a score\nabove 100, so \"Perfect!\" never displays.\nIs this an error?",o:["A. Syntax error","B. Logic error (should be >= 100 or > 99)","C. Runtime error","D. Not necessarily an error, depends on intent"],a:3,e:"If the intent is to display \"Perfect!\" only for scores strictly above 100, and no such scores exist, the code is technically correct. If the intent was >= 100, it's a logic error. Context matters. The exam sometimes tests whether something is an error or just unusual behavior."},
{type:"mcq",q:"A function is supposed to return\nthe average of a list. For the input\n[10, 20, 30], it returns 20. For\n[5, 5, 5, 5], it returns 5. For\nan empty list, it crashes.\nWhat type(s) of error are present?",o:["A. Only logic error","B. Only runtime error","C. Both: logic error and runtime error","D. No errors"],a:1,e:"For non-empty lists it returns correct results (20 and 5 are correct averages). For empty lists it crashes (division by zero). This is a runtime error only. There's no logic error since the non-empty cases work correctly. The fix would be to add a check for empty lists."},

{cluster:"Collaboration & Development (BI1)",desc:"How programs are designed, built, tested."},
{type:"open",q:"What is iterative development?\nWhy is it better than trying to\nbuild the entire program at once?",a:"Iterative development: build in small cycles.\nEach cycle: plan → code → test → evaluate → repeat.\n\nWhy it's better:\n1. Catch bugs early (test after each small piece)\n2. Get feedback before building too much\n3. Easier to change direction if needed\n4. Less overwhelming (small pieces vs huge project)\n5. Always have a working version to show\n6. Reduces risk: if something doesn't work,\n   you only lose one cycle's work, not everything\n\nWaterfall (build all at once) risks:\n- Discovering major bugs only at the end\n- Building features nobody wants\n- Difficult to change course mid-project"},
{type:"open",q:"A function accepts ages 1-120 as input.\nDesign a thorough set of test cases.",a:"Boundary tests:\n- age = 0 (just below valid, should reject)\n- age = 1 (lower boundary, should accept)\n- age = 120 (upper boundary, should accept)\n- age = 121 (just above valid, should reject)\n\nNormal cases:\n- age = 25 (typical adult)\n- age = 65 (typical senior)\n\nEdge cases:\n- age = -1 (negative, should reject)\n- age = -999 (very negative)\n- age = 999 (very large, should reject)\n- age = 0 (zero, should reject)\n\nSpecial inputs (if applicable):\n- age = 12.5 (non-integer)\n- age = \"twenty\" (string instead of number)\n- Empty input (nothing entered)\n\nThis covers: boundaries, normal operation,\ninvalid inputs, and edge cases."},
{type:"mcq",q:"Program PURPOSE is best described as:",o:["A. The specific lines of code in the program","B. The problem the program solves and the users it serves","C. The programming language used","D. The number of functions in the program"],a:1,e:"Purpose = WHY the program exists. What problem does it address? Who benefits? This is about the real-world impact, not the technical implementation."},
{type:"mcq",q:"Which is a benefit of collaboration\nin programming?",o:["A. Only one person needs to test the code","B. Diverse perspectives help identify issues and generate creative solutions","C. Everyone writes the same code independently","D. Collaboration eliminates all bugs"],a:1,e:"Different perspectives catch different issues. One programmer's blind spot might be another's expertise. Collaboration also helps with: code review, pair programming, and dividing complex tasks."},
{type:"mcq",q:"Version control (like Git) helps\ncollaboration by:",o:["A. Making the code run faster","B. Tracking every change, allowing multiple developers to work simultaneously without overwriting each other's work","C. Automatically fixing bugs","D. Translating code between languages"],a:1,e:"Git tracks who changed what, when, and why. Multiple developers can work on different parts simultaneously and merge their changes. If something breaks, you can revert to a previous version."},
{type:"mcq",q:"Which is the BEST example of\nboundary testing?",o:["A. Testing with the value 50 for a function that accepts 1-100","B. Testing with values 0, 1, 100, and 101 for a function that accepts 1-100","C. Testing with only negative numbers","D. Testing with random values"],a:1,e:"Boundary testing checks at and just outside the edges: 0 (just below lower), 1 (lower boundary), 100 (upper boundary), 101 (just above upper). This catches off-by-one errors. Testing 50 alone only checks one normal case."},
{type:"mcq",q:"A program works correctly for all test\ncases during development. After release,\nusers encounter crashes with unusual inputs\nthe developer didn't consider. This shows:",o:["A. The programming language is flawed","B. Testing was insufficient, particularly for edge cases and unexpected inputs","C. Users are using the program wrong","D. Programs always crash eventually"],a:1,e:"If developers only test with expected inputs, unexpected user behavior causes crashes. Thorough testing includes edge cases, invalid inputs, and unusual combinations. No program is fully tested, but more testing catches more issues."},

{cluster:"Mixed BI4 + BI1 Challenges",desc:"Everything combined. Exam-level."},
{type:"mcq",q:"A message is sent from Server A to\nClient B. Which accurately describes\nthe process?",o:["A. The message is sent as one continuous stream directly from A to B","B. The message is broken into packets by TCP, addressed by IP, routed through multiple paths, and reassembled at B","C. DNS delivers the message","D. HTTP converts the message to binary"],a:1,e:"TCP breaks it into packets, IP addresses them, routers forward them (possibly via different paths), and TCP reassembles at the destination. DNS only does name resolution. HTTP is for web requests, not general message delivery."},
{type:"mcq",q:"A student builds a calculator app.\nIt works for addition, subtraction,\nand multiplication. Division by zero\ncauses a crash. The student should:",o:["A. Remove the division feature entirely","B. Add input validation to check for zero before dividing, preventing the runtime error","C. Tell users never to divide by zero","D. Ignore it since it rarely happens"],a:1,e:"The professional approach: validate input before performing the operation. If the divisor is zero, display an error message instead of crashing. This prevents the runtime error."},
{type:"mcq",q:"The internet is decentralized, meaning:",o:["A. No single entity owns or controls the entire network","B. All data is stored in one location","C. Only one company manages internet traffic","D. The internet works without any protocols"],a:0,e:"No single government, company, or organization controls the internet. It's a network of independently operated networks that agree on common protocols. This design makes it resilient and hard to shut down completely."},
{type:"mcq",q:"A developer writes a function but\ndoesn't document it. Six months later,\nthey can't remember how it works.\nThis illustrates the importance of:",o:["A. Using faster computers","B. Code documentation and comments","C. Writing shorter programs","D. Using more variables"],a:1,e:"Documentation helps future-you (and others) understand code. Comments should explain WHY decisions were made, not just restate what the code does. Without documentation, maintaining code becomes much harder."},
{type:"mcq",q:"Network A has 3 connections between\n4 devices. Network B has 6 connections\nbetween 4 devices.\nWhich is more fault-tolerant?",o:["A. Network A","B. Network B","C. Both are equal","D. Cannot be determined"],a:1,e:"More connections = more redundancy = more fault tolerance. With 4 devices, 6 connections is the maximum (fully connected). 3 connections is the minimum to keep all devices reachable. B has more alternate paths."},
{type:"mcq",q:"A student collaborates with a partner\non a project. The partner changes a\nfunction that the student was also\nmodifying. Without version control:",o:["A. Both changes are automatically merged","B. One person's changes may overwrite the other's, causing lost work","C. The program becomes faster","D. Both versions are kept separately forever"],a:1,e:"Without version control, if both edit the same file, whoever saves last overwrites the other's work. Version control detects conflicts and lets developers merge changes deliberately."},
{type:"mcq",q:"Pair programming means:",o:["A. Two programmers write code on separate computers","B. One person writes code (driver) while the other reviews in real-time (navigator)","C. Two people share a keyboard, taking turns typing","D. Two programs are linked together"],a:1,e:"Driver writes code, navigator reviews, thinks strategically, and catches errors. They switch roles periodically. This isn't just two people coding separately, it's an active collaborative technique."},
{type:"mcq",q:"Which combination correctly describes\nall four protocols?\n\nDNS: name→IP\nIP: packet addressing\nTCP: reliable delivery\nHTTP: web page requests",o:["A. All four are correct","B. DNS and IP are correct but TCP and HTTP are switched","C. Only DNS is correct","D. None are correct"],a:0,e:"All four descriptions are accurate. DNS resolves names to IPs. IP handles addressing and routing. TCP ensures packets arrive completely and in order. HTTP defines how browsers request and receive web pages."},
{type:"mcq",q:"A program is tested with values\n5, 10, 15, 20, 25 and works correctly.\nBut it crashes with input 0.\nThe developer's testing lacked:",o:["A. Enough normal cases","B. Edge case and boundary testing (0 is a common edge case)","C. Performance testing","D. User interface testing"],a:1,e:"0 is a classic edge case (potential division by zero, empty state, boundary condition). Testing only mid-range normal values misses boundary and edge cases where bugs often hide."},
{type:"mcq",q:"If all internet traffic had to pass\nthrough a single central server,\nthe internet would:",o:["A. Be faster for everyone","B. Have a single point of failure and be vulnerable to total shutdown","C. Be more secure","D. Use less energy"],a:1,e:"A central bottleneck would: crash from overload, be a single point of failure (one failure takes down everything), and be a target for attacks. The internet's decentralized design avoids exactly this scenario."}
];

function build(){
    const el=document.getElementById('content');let qNum=0,html='';
    DATA.forEach(item=>{
        if(item.cluster){html+=`<div class="cluster"><div class="cluster-title">${item.cluster}</div><div class="cluster-desc">${item.desc}</div></div>`;return;}
        qNum++;const qid='q'+qNum;
        if(item.type==='open'){
            html+=`<div class="qcard"><div class="qhead"><span class="qnum">${qNum}</span><span class="qtype">OPEN</span></div><div class="qtext">${esc(item.q)}</div><textarea class="open-input mono" placeholder="Her answer..."></textarea><button class="reveal-btn" onclick="rv(this)">Show Answer</button><div class="ans-box"><div class="ans-text">${esc(item.a)}</div></div></div>`;
        } else {
            html+=`<div class="qcard" id="${qid}" data-rev="0" data-sel=""><div class="qhead"><span class="qnum">${qNum}</span><span class="qtype">MCQ</span></div><div class="qtext">${esc(item.q)}</div><div class="opts">`;
            item.o.forEach((opt,oi)=>{html+=`<button class="opt" data-i="${oi}" onclick="so(this,'${qid}')">${esc(opt)}</button>`;});
            html+=`</div><button class="chk" onclick="ck(this,'${qid}',${item.a})">Check Answer</button><div class="expl">${esc(item.e)}</div></div>`;
        }
    });el.innerHTML=html;
}
function rv(btn){const a=btn.nextElementSibling;const s=a.classList.contains('show');a.classList.toggle('show');btn.textContent=s?'Show Answer':'Hide';btn.classList.toggle('on',!s);}
function so(btn,qid){const c=document.getElementById(qid);if(c.dataset.rev==='1')return;c.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));btn.classList.add('sel');c.dataset.sel=btn.dataset.i;c.querySelector('.chk').classList.add('rdy');}
function ck(btn,qid,ans){const c=document.getElementById(qid);if(!c.dataset.sel||c.dataset.sel==='')return;if(c.dataset.rev==='1')return;c.dataset.rev='1';const s=parseInt(c.dataset.sel);c.querySelectorAll('.opt').forEach((o,i)=>{o.classList.add('locked');o.classList.remove('sel');if(i===ans)o.classList.add('right');else if(i===s&&i!==ans)o.classList.add('wrong');});c.querySelector('.expl').classList.add('show');if(s===ans)correct++;else wrong++;answered++;upd();btn.style.display='none';}
function upd(){document.getElementById('sc-c').textContent='Correct: '+correct;document.getElementById('sc-w').textContent='Wrong: '+wrong;document.getElementById('sc-t').textContent='Answered: '+answered+' / 50';}
window.addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-window.innerHeight;document.getElementById('prog').style.width=(window.scrollY/h*100)+'%';});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
build();
</script>
